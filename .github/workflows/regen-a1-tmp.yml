name: regen-a1-tmp

# TEMPORARY — ticket A1 (order-cancel-stock). PHP and C# are generated through the openapi-generator DOCKER image, and the owner's laptop runs
# no docker: this regenerates every SDK on a hosted runner and hands sdks/ back as an artifact, then runs the rest of the pipeline.
# SPEC_DRIFT=off because the backend PR carrying this contract is not merged yet (backend first, then clients). Removed in the very next
# commit; never merged.
on:
  push:
    branches: [feat/cancel-stock-a1]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' generators/versions.env >>"$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Spec is the synced contract (drift check off — the backend is not merged)
        env:
          SPEC_DRIFT: "off"
        run: make spec-check

      - name: Regenerate every SDK
        run: make generate

      - name: What differs from the committed sdks/
        run: git status --porcelain -- sdks | tee "$RUNNER_TEMP/sdks-status.txt"; git --no-pager diff --stat -- sdks | tail -3 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sdks-regenerated
          path: sdks
          include-hidden-files: true
          retention-days: 3

      - name: Committed sdks/ == fresh generation
        run: make verify-clean

      - name: Compile / type-check SDKs + examples, webhook vectors
        env:
          TMPDIR: ${{ runner.temp }}
        run: make check

      - name: Quickstarts against a local mock of the contract
        env:
          TMPDIR: ${{ runner.temp }}
        run: make smoke
