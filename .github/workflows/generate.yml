name: generate

# Regenerates every SDK from spec/openapi.yaml and FAILS if the committed sdks/ differ — so a hand
# edit to generated code, or a spec/generator change committed without regenerating, cannot land.
# Then compiles/type-checks every SDK and example, runs each webhook verifier against the shared
# vectors, and runs every quickstart against a local mock of the contract. Publishes NOTHING
# (npm / PyPI / Packagist / NuGet / Go tag = S6, see README › Publishing).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Per-ref; superseded PR pushes are cancelled, main runs never are (a cancelled main run reads as
  # "CI never ran" — see the estate's github-actions-traps).
  group: generate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # setup-go installs the pinned Go; `local` stops Go from also extracting a toolchain module into
  # the shared module cache (two jobs on one box tear the tar — ozb-stream ci.yml has the history).
  GOTOOLCHAIN: local

jobs:
  generate:
    # GitHub-hosted, not the org's self-hosted `dona-ci` fleet: since this repo went public
    # (2026-09-26) the org's runner group has `allows_public_repositories: false` (correctly — those
    # runners carry `dona-deploy` and sit near production credentials; a public repo's PRs must never
    # be able to run code on them), so a self-hosted job here queues forever and never starts. Hosted
    # minutes are free and unlimited for public repos (hosted-runners-spend-the-quota's $40-cap
    # concern is about PRIVATE-repo minutes only), so this costs nothing and is the more isolated
    # choice besides — see security/incidents/2026-09-26-public-repo-cannot-use-self-hosted-runners.md.
    runs-on: ubuntu-latest
    # Ceiling for a wedged run, not a slow build. A cold run pulls ~2 GB of images (generator, php,
    # composer, dotnet) with no warm cache (hosted runners are ephemeral, unlike the old self-hosted box).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned versions
        # generators/versions.env is the ONE place versions live; the Makefile includes the same file.
        run: grep -E '^[A-Z_]+=' generators/versions.env >>"$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Spec is the synced contract, and the one the backend serves
        # Drift source: BACKEND_READ_TOKEN (read-only on ozb-backend) when set, else the public
        # GET https://api.dona.im/seller-api/v1/openapi.json (the server embeds the JSON byte for byte).
        env:
          BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
        run: make spec-check

      - name: Regenerate every SDK
        run: make generate

      - name: Committed sdks/ == fresh generation (a hand edit fails here)
        run: make verify-clean

      - name: Compile / type-check SDKs + examples, webhook vectors
        env:
          TMPDIR: ${{ runner.temp }}
        run: make check

      - name: Quickstarts against a local mock of the contract
        env:
          TMPDIR: ${{ runner.temp }}
        run: make smoke
