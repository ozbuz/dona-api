# Dona API v1 — FROZEN wire contract (2026-09-24). Change it HERE first — see README.md in this folder.
openapi: 3.1.0
info:
  title: Dona API
  version: v1 (frozen 2026-09-24)
  summary: Seller API — catalog, stock, orders, health, attention, events, webhooks.
  description: |-
    **FROZEN WIRE CONTRACT — 2026-09-24.** Source of truth for the backend (`internal/sellerapi`), the seller portal and Dona Control.
    Any change lands in `architecture/DB/seller-api/contract/` FIRST (see its README), then in code. Names, codes, headers, scopes and
    tiers are verbatim from `architecture/DB/seller-api/glossary.md`; a name not there is not fixed.

    ### Conventions
    | Topic | Rule |
    |---|---|
    | Auth | `Authorization: Bearer dona_sk_live_…` (bare `Authorization: dona_…` accepted). `X-Api-Key` or a key in the query ⇒ `401 use_authorization_header`. A seller/app/staff JWT on this tree ⇒ 401; a key on `/api/v1/*` ⇒ 401. Kinds: `sk` seller · `ak` agent (MCP only) · `it` vendor install (S6, + `Dona-Seller` header). |
    | Tenancy | The key IS the tenant. No tenant id in any path. A foreign or missing id is `404 not_found`, never 403. A vendor-app install key (`it`, S6) is bound to ONE shop too and must also NAME it in `Dona-Seller` on every request (every operation lists the parameter): missing ⇒ `400 invalid_body` + `details[{field:"Dona-Seller", code:"required"}]`; sent twice, or not ONE id in canonical form (lower-case, 36 characters) ⇒ `400 invalid_body` + `details[{field:"Dona-Seller", code:"invalid"}]`; another shop's id ⇒ `404 not_found`, nothing read. One vendor app's installs share its per-app bucket (`429 rate_limited` + `Dona-Rate-Limited-Reason: app-rate`); a frozen app ⇒ `403 app_frozen`; an uninstalled app's key ⇒ `401 api_key_revoked`. An install key can never hold `orders:pii`, `finance:read`, `mcp` or `webhooks:manage`, and it sees nothing of the shop's OTHER keys: their `key.*` events and the `attention.*` events and items about them are not in its feed, and another key's job is `404 not_found` at `GET /jobs/{id}` and its download. |
    | Body | JSON UTF-8. Money `*_uzs` integer soʻm. Times out: ISO 8601 with offset; in: ISO 8601 **or** epoch-ms. Titles are `{uz,ru,en}` objects. |
    | Errors | `{error, message, request_id, details[], doc_url}` + optional `retry_after_seconds`, `required_scope`, `rotate_url`, `suspended_until`, `reason`, `meta`. Branch on `error`, never on `message`. |
    | `202 held_for_review` | A success envelope (`code`, no `error`): the plausibility guard held the write; nothing was written. |
    | Pagination | Keyset: `?cursor=&limit=` → `{items, next_cursor, has_more, meta?}`; `next_cursor` is `null` when `has_more` is false (on `/events` it is the last id seen). `limit` ≤ 100 (≤ 200 on `/events`), default 50. `page` (0-based) only on `/orders` and `/stock`. No `COUNT(*)`. |
    | Consistency | `updated_since` on every list; visible high-water mark capped at `now() − 10 s`; a key's reads pin to the primary for 10 s after its own write. |
    | Idempotency | `Idempotency-Key` REQUIRED on every POST/PATCH except the naturally idempotent/safe ones marked in each operation (`/attention/{id}/ack`, `/webhooks/{id}/ping`, `/media/upload-url`, `/orders/labels`). Scope = key × route; 24 h byte-identical replay of terminal 2xx/4xx; 5xx never stored; `409 idempotency_in_progress` / `idempotency_mismatch`. A replay never re-reveals a webhook secret. |
    | Dry run | `Dona-Dry-Run: true` or `?dry_run=true` on every write: validate + guard + effect, rolled back, zero side-effect rows. **Only the literal strings `true` and `false`** are read, in either place (S4, C51): `1`, `0`, `yes`, `on`, `TRUE`, an empty value ⇒ `400 invalid_body` + `details[{field:"dry_run"\|"Dona-Dry-Run", code:"invalid"}]` — never guessed at. Any one `true` wins. |
    | Limits | Five Valkey buckets keyed on the PROVEN key/seller (never IP). Every response carries `RateLimit-Policy`, `RateLimit`, `X-RateLimit-*`; every 429/503 adds `Retry-After` + `Dona-Rate-Limited-Reason`. Our own 429/503/5xx and `key_suspended` cost 0 and never feed the breaker. The breaker is the only automatic sanction: `403 key_suspended` (15 min → 1 h → 4 h … cap 24 h). |
    | Kill switches | `app_config.seller_api.enabled` (off ⇒ `503 limits_unavailable` everywhere), `writes_enabled` (seeded false; gates marketplace-mutating operations — each says so), `webhooks_enabled` (the `/webhooks` family + dispatch). |
    | Enums | Open: new values are additive. Clients MUST tolerate an unknown value. |

    ### Vendor extensions
    | Extension | Meaning |
    |---|---|
    | `x-dona-scope` | A glossary scope; `any` = any valid key; `none` = public. Write implies read. |
    | `x-dona-tier` | `basic` · `advanced` (key tier) · `public` (docs level, no key). |
    | `x-dona-limit` | `{bucket, cost}` — `bucket` is a `Dona-Rate-Limited-Reason` value (`key-rate`, `write-rate`) or `edge`/`none` for public routes and webhook deliveries; `cost` is an integer or the rule string. Writes also count against `key-rate` and `seller-rate`. |
    | `x-dona-since` | Until publication: the build increment that ships the operation (`S1`, `S3`, `S4`). At publication it becomes the ISO date the operation went live. |
    | `x-dona-deprecated` | `{date, sunset, replacement}` — none in v1. |

    ### MCP door (not described operation by operation here)
    `https://api.dona.im/seller-api/mcp` (Streamable HTTP, JSON-RPC 2.0) is a separate door for AI agents with an agent key
    (`dona_ak_live_…`, which must hold `mcp`); `sk` and `it` keys are refused there (`401 key_kind_not_accepted`), and an `ak` key is
    refused on this tree. Every call is journaled. Read tools (S2): `dona.shop.get` · `dona.catalog.search` · `dona.catalog.get` ·
    `dona.orders.list` · `dona.orders.get` · `dona.events.list` · `dona.attention.list` · `dona.health.get` · `dona.docs.search`.

    **Write tools (S5)** — listed only for an ADVANCED shop, only while `writes_enabled` is on, never under `Dona-MCP-Readonly: true`.
    Each runs the same write pipeline as its REST twin (guard, fence, cooldown, idempotency — `request_id` is the `Idempotency-Key` —
    dry run, codes); unknown arguments ⇒ `invalid_body` + `details[{code:"unknown_field"}]`.
    | Tool | Scope | Arguments | REST twin |
    |---|---|---|---|
    | `dona.catalog.update_stock` | `catalog:stock` | `request_id`, `product_id`, `variant_id?`, `delta` (non-zero, never absolute; its size is capped by `limits.mcp.stock_delta_max`), `dry_run?` | `POST /stock` |
    | `dona.catalog.update_price` | `catalog:stock` | `request_id`, `product_id`, `variant_id?`, `price_uzs` ≥ 1, `compare_at_uzs?`, `dry_run?` | `POST /prices` |
    | `dona.orders.ship` | `orders:write` | `request_id`, `order_id`, `dry_run?` | `POST /orders/{id}/ship` |
    | `dona.orders.cancel` | `orders:cancel` | `request_id`, `order_id`, `reason` (a code, not `other`), `dry_run?` | `POST /orders/{id}/decline` before acceptance · `/cancel` after |

    ⛔ Never an executed write on the first call. A client that declares form elicitation gets `input_required` + one confirmation
    form + a single-use `requestState` (HMAC, 5 min, ≤ 3 rounds); the confirmed re-call writes exactly once. Any other client gets
    `approval_required` (+ `approval_id`, `approval_url`, `expires_at`) and the write becomes a pending INTENT that the shop OWNER
    confirms in Sozlamalar › API › Kutilayotgan yozuvlar (`seller_api_held_writes`, rule `confirmation_required`, 24 h, ≤ 25 per
    key); the agent re-calls with the same `request_id` to learn the outcome. Dona staff can cancel an intent, never approve one.
    MCP-only codes: `approval_required` (202) · `confirmation_declined` (409, nothing written) · `intent_limit` (429) ·
    `intent_unavailable` (503) · `request_state_invalid` (400) · `request_state_foreign` (403) · `request_state_mismatch` (409) ·
    `request_state_expired` (410) · `request_state_replayed` (409) · `held_write_not_pending` / `hold_expired` (an intent's fate) ·
    `tier_required` (403, a BASIC shop) · `invalid_body` + `details[{code:"read_only"}]` (a write under `Dona-MCP-Readonly: true`).

    **Door 2 — OAuth 2.1 (S7)** for claude.ai / ChatGPT connectors, which cannot hold a pasted key: an authorization
    server at `https://api.dona.im/seller-api/oauth` (RFC 8414 metadata at
    `/.well-known/oauth-authorization-server/seller-api/oauth`; the host form `https://auth.dona.im` once its DNS exists),
    advertised by the RFC 9728 document at `/.well-known/oauth-protected-resource/seller-api/mcp` while
    `oauth_enabled` is on (`authorization_servers: []` otherwise). Public clients only — a Client ID Metadata Document
    whose EXACT URL is on Dona's allow-list (its host too), PKCE `S256`, exact `redirect_uri`, `resource` =
    `https://api.dona.im/seller-api/mcp`; the shop OWNER consents in the seller portal and can disconnect any time
    (Sozlamalar › API › Ulangan ilovalar). Access tokens are ES256 JWTs (`typ at+jwt`, ≤ 1 h, `aud` exactly the resource
    above); refresh tokens rotate and a reused one revokes the grant — except within 60 s of its rotation while its
    successor was never used (a retry, two parallel refreshes), which is answered with the SAME successor again. ⛔ **Reads only over OAuth in v1**: a consent never carries a write scope, and every
    write tool answers a door-2 token `403 insufficient_scope` + `details[{field:"credential", code:"oauth_read_only"}]` —
    writes stay with agent keys. A door-2 token on this REST tree is `401`; a bad, expired or revoked one on the MCP
    door is `401 invalid_token`.
  contact:
    name: Dona API
    url: https://dona.uz/developers
  license:
