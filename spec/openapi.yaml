  /jobs/{id}/download:
    get:
      operationId: downloadJobFile
      summary: Download an export's file
      tags:
      - Jobs
      description: What a ready export's `file_url` points at. Needs BOTH a key of the job's shop that holds the scope the job's
        kind needs (any key of the shop — the file is the shop's; a key of another shop is `404 not_found` whatever token it
        carries) AND the job's own `token` from `file_url`, valid 15 min (`401 download_token_invalid` when absent, forged or
        another job's; `401 download_token_expired` past its time — re-read `GET /jobs/{id}` for a fresh one). The file is kept
        in the database, never on a public origin, and is swept with its job after `expires_at` (7 d) ⇒ `404 not_found`. Not
        gated by `writes_enabled`.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: token
        in: query
        required: true
        description: The download token `file_url` carries (`v1.<unix expiry>.<mac>`), bound to this job and this shop.
        schema:
          type: string
          pattern: ^v1\.[0-9]+\.[A-Za-z0-9_-]+$
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/DonaSeller'
      - $ref: '#/components/parameters/XDonaIntegration'
