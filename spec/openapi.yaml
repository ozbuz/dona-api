    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - export_products
          - export_orders
          - products_batch
        status:
          type: string
          enum:
          - pending
          - running
          - ready
          - failed
        progress:
          type: object
          properties:
            done:
              type: integer
            total:
              type:
              - integer
              - 'null'
          required:
          - done
          - total
        file_url:
          type:
          - string
          - 'null'
          format: uri
          description: '`GET /jobs/{id}/download?token=…` — the token is valid 15 min from this response and only for a key of
            this shop (never a public or pre-signed object URL); re-read the job for a fresh one.'
        file_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LineResult'
          description: '`products_batch` only: the per-line shape.'
        error:
          type:
          - string
          - 'null'
          description: Our code only.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 with offset (Tashkent `+05:00` on output).
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Row + file swept after this (7 d); then `404 not_found`.
      required:
      - id
      - kind
      - status
      - progress
      - file_url
      - file_expires_at
      - results
      - error
      - created_at
      - finished_at
      - expires_at
