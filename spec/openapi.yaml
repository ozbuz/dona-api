servers:
- url: https://api.dona.im/seller-api/v1
  description: Production (the only environment; `dry_run` is the rehearsal).
security:
- bearerKey: []
tags:
- name: Account
  description: The key's own view of itself and its shop.
- name: Catalog
  description: Products, variants, media, publish/delist. Writes go through the shared guarded seams.
- name: Stock & prices
  description: Absolute, bulk, guarded (`catalog.ApplyGuardedStockPrice`).
- name: Orders
  description: The `orders:read` projection has no buyer PII; `orders:pii` (ADVANCED, `sk`) adds it.
- name: Returns
  description: Read-only in v1.
- name: Health
  description: Account health, metrics, verification verdicts.
- name: Attention
  description: The seller-keyed "errors, warnings, attention required" channel (`seller_attention_items`).
- name: Events
  description: '`/events` — the primary, pollable change feed.'
- name: Webhooks
  description: Signed push of the same events (Standard Webhooks).
- name: Taxonomy
  description: Platform-owned categories, brands, IKPU (T4).
- name: Jobs
  description: Async exports and product batches.
- name: Finance
  description: Balance and settlement lines (ADVANCED).
- name: Keys
  description: Read-only list of the shop's keys.
- name: Meta
  description: 'Public: ping, status, changelog, this spec, llms.txt.'
- name: Webhook events
  description: What Dona POSTs to your endpoint — see the top-level `webhooks`.
paths:
  /me:
    get:
      operationId: getMe
      summary: Who am I — key, shop, tier, limits
      tags:
      - Account
      description: 'The first call of every integration: the key''s own row, the shop''s three verdicts, the derived tier, the live
        limits with remaining budget, and the open attention counts. Fails closed: a DB error answers `503 auth_unavailable`.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/DonaSeller'
      - $ref: '#/components/parameters/XDonaIntegration'
      responses:
        '200':
          description: OK
          headers:
            Dona-Request-Id:
              $ref: '#/components/headers/Dona-Request-Id'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Dona-Key-Expires:
              $ref: '#/components/headers/X-Dona-Key-Expires'
            Dona-API-Warn:
              $ref: '#/components/headers/Dona-API-Warn'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                key:
                  id: 0199760c-2f4b-7a3e-9d21-5c8e4b1f0a37
                  name: billz-prod
                  kind: sk
                  prefix: dona_sk_live_3fK
                  scopes:
                  - catalog:read
                  - catalog:stock
                  - orders:read
                  expires_at: '2027-09-24T00:00:00+05:00'
                  ip_allow: []
                shop:
                  id: 0198f3a2-6c1d-7b40-8e55-2a9c3d4e5f60
                  name: Bahor Textile
                  status: approved
                  documents_status: approved
                  kyc_status: approved
                  can_sell: true
                tier: basic
                api_access:
                  state: enabled
                  reason: null
                writes_enabled: false
                limits:
                  requests_per_min: 300
                  burst: 60
                  requests_per_day: 100000
                  writes_per_min: 60
                  writes_per_day: 20000
                  in_flight: 4
                  seller_requests_per_min: 900
                  remaining:
                    requests_per_min: 287
                    requests_per_day: 99412
                    writes_per_min: 60
                    writes_per_day: 20000
                attention:
                  open: 3
                  action_required: 2
                docs_url: https://dona.uz/developers
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dona-scope: any
      x-dona-tier: basic
      x-dona-limit:
        bucket: key-rate
        cost: 1
      x-dona-since: S1
  /ping:
    get:
      operationId: ping
      summary: Liveness (key optional)
      tags:
      - Meta
      description: Public. Without `Authorization` it answers `authenticated:false`. With a key the key is fully verified — a bad key
        is `401`, never a silent `false`.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/DonaSeller'
      responses:
        '200':
          description: OK
          headers:
            Dona-Request-Id:
              $ref: '#/components/headers/Dona-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
              example:
                ok: pong
                time: '2026-09-24T14:05:12+05:00'
                authenticated: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - {}
      - bearerKey: []
      x-dona-scope: none
      x-dona-tier: public
      x-dona-limit:
        bucket: edge
        cost: 0
      x-dona-since: S1
  /products:
    get:
      operationId: listProducts
      summary: List products
      tags:
      - Catalog
      description: Keyset list of the shop's products (`deleted_at IS NULL`). Deletions never appear in a delta — read `/products/deleted`.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/UpdatedSince'
      - name: status
        in: query
        required: false
        description: Product status filter.
        schema:
          type: string
      - name: seller_sku
        in: query
        required: false
        description: Exact.
        schema:
          type: string
      - name: barcode
        in: query
        required: false
        description: Exact.
        schema:
          type: string
      - name: external_id
        in: query
        required: false
        description: Exact.
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Title search (prefix FTS).
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/DonaSeller'
      - $ref: '#/components/parameters/XDonaIntegration'
      responses:
        '200':
          description: OK
          headers:
            Dona-Request-Id:
              $ref: '#/components/headers/Dona-Request-Id'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Dona-Key-Expires:
              $ref: '#/components/headers/X-Dona-Key-Expires'
            Dona-API-Warn:
              $ref: '#/components/headers/Dona-API-Warn'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                - id: 0199612e-8a0b-7c4d-b1e2-3f4a5b6c7d8e
                  title:
                    uz: Erkaklar futbolkasi, paxta
                    ru: Футболка мужская, хлопок
                  description:
                    uz: 100% paxta, Oʻzbekistonda tikilgan.
                  status: active
                  category_id: 01972a10-1111-7aaa-8bbb-0123456789ab
                  brand: Bahor
                  seller_sku: A-200
                  barcode: '4780000000012'
                  external_id: 1c:0f2a9b
                  price_uzs: 189000
                  compare_at_uzs: 229000
                  stock: 10
                  has_variants: true
                  variants:
                  - id: 0199612e-8a0c-7d11-a0b2-9e8f7a6b5c4d
                    options:
                      color: Qizil
                      size: M
                    sku: A-200-R-M
                    barcode: '4780000000029'
                    price_uzs: 189000
                    compare_at_uzs: null
                    stock: 4
                    status: active
                    version: '2026-09-24T13:59:41.120318+05:00'
                  ikpu: '06109100001000000'
                  package_code: '1520227'
                  image_urls:
                  - https://media.dona.im/p/0199612e/1.webp
                  video_url: null
                  attributes:
                    material: paxta
                  created_via: api
                  hold: null
                  open_issues: 0
                  version: '2026-09-24T13:59:41.120318+05:00'
                  created_at: '2026-09-20T10:11:12+05:00'
                  updated_at: '2026-09-24T13:59:41+05:00'
                next_cursor: eyJ1IjoiMjAyNi0wOS0yNFQwODo1OTo0MSJ9
                has_more: true
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dona-scope: catalog:read
      x-dona-tier: basic
      x-dona-limit:
        bucket: key-rate
        cost: 1 + ceil(limit/50) when limit > 50, else 1
      x-dona-since: S1
    post:
      operationId: createProduct
      summary: Create a product (lands as draft / ai_review)
      tags:
      - Catalog
      description: '`UpsertExternalProduct` with `created_via=''api''`. Lands `draft`/`ai_review`; `publish:true` asks to publish, and
        a pending shop''s publish waits in `product_shop_holds` (`hold.reason=shop_not_activated`). The plausibility guard may answer
        `202 held_for_review` (e.g. `price_floor`). Kill switch: `writes_enabled`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/DonaDryRun'
      - $ref: '#/components/parameters/DryRunQuery'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/DonaSeller'
      - $ref: '#/components/parameters/XDonaIntegration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Created
          headers:
            Dona-Request-Id:
              $ref: '#/components/headers/Dona-Request-Id'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Dona-Key-Expires:
              $ref: '#/components/headers/X-Dona-Key-Expires'
            Dona-API-Warn:
              $ref: '#/components/headers/Dona-API-Warn'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreated'
              example:
                id: 0199612e-8a0b-7c4d-b1e2-3f4a5b6c7d8e
                status: draft
                hold:
                  reason: shop_not_activated
                issues: []
                created_via: api
        '202':
          description: Held for review — nothing written.
          headers:
            Dona-Request-Id:
              $ref: '#/components/headers/Dona-Request-Id'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Dona-Key-Expires:
              $ref: '#/components/headers/X-Dona-Key-Expires'
            Dona-API-Warn:
              $ref: '#/components/headers/Dona-API-Warn'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeldForReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-dona-scope: catalog:write
      x-dona-tier: basic
      x-dona-limit:
        bucket: write-rate
        cost: 1
      x-dona-since: S3
  /products/{id}:
    get:
      operationId: getProduct
