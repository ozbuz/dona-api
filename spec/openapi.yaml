      description: 'An order NOT YET ACCEPTED. The portal decline''s own body (`order.DeclineOrderInTx`) on the marketplace pool, in the
        write pipeline (stamped transaction, wallet-cutover fence): restock, the buyer''s kiwi/vouchers/delivery money back, the
        `declined`/`seller` timeline row; the card refund at the provider and the buyer notice run after the commit (never on a dry
        run). The reason is stored in `decline_reason_code`. ADVANCED, derived on THIS request (a documents-waived or downgraded shop
        is `403 tier_required`). 400 `invalid_decline_reason` (`details[comment: required]` for `other` without words); 409
        `order_not_acceptable` (an accepted or closed order — the portal names it `order_not_decidable`; cancel an accepted one),
        `order_has_active_return`. Another shop''s order ⇒ `404`. Kill switch: `writes_enabled`. Served by the marketplace process
        only: a SERVER_ROLE=seller-api server answers `503 role_unavailable` (after the key, scope and tier; before the dry-run flag,
        the switch, the body and the idempotency claim — nothing changes; D3).'
