components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      bearerFormat: dona_<sk|ak|it>_live_<43 base62><6 base62 CRC32>
      description: A Dona API key minted by the shop OWNER in the seller portal (Sozlamalar › API), shown once, stored as a keyed fingerprint,
        expiring (≤ 365 d `sk`, ≤ 90 d `ak`) — or, for a vendor app (`it`, S6), minted by the owner's INSTALL of that app (one key per
        shop × app, revoked with the uninstall, never rotated) and always sent with `Dona-Seller`. A bad checksum is refused before any
        DB read (`401 api_key_malformed`).
  headers:
    Dona-Request-Id:
      description: Server-minted `req_<uuidv7>`, on every response and in every error body. Inbound `X-Request-Id` is ignored.
      schema:
        type: string
        pattern: ^req_[0-9a-f-]{36}$
      example: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
    RateLimit-Policy:
      description: 'draft-ietf-httpapi-ratelimit-headers-11 structured field: every bucket this key is subject to (`q` quota, `w` window
        seconds).'
      schema:
        type: string
      example: '"key-rate"; q=300; w=60, "key-rate"; q=100000; w=86400, "write-rate"; q=60; w=60, "concurrency"; q=4'
    RateLimit:
      description: 'The bucket closest to exhaustion: `r` remaining, `t` seconds to reset.'
      schema:
        type: string
      example: '"key-rate"; r=287; t=41'
    X-RateLimit-Limit:
      description: Legacy mirror of the closest bucket's quota (for WB/Uzum-shaped adapters).
      schema:
        type: integer
      example: 300
    X-RateLimit-Remaining:
      description: 'Legacy mirror: remaining in the closest bucket.'
      schema:
        type: integer
      example: 287
    X-RateLimit-Reset:
      description: 'Legacy mirror: seconds until the closest bucket resets.'
      schema:
        type: integer
      example: 41
    Location:
      description: 'On a job''s `202` (`POST /exports/*`, `/products/batch`): the job''s status route, the same value as
        `links.self` — poll it with `GET` no sooner than `Retry-After`. The idempotent replay of the `202` carries it too.'
      schema:
        type: string
        format: uri-reference
      example: /seller-api/v1/jobs/01997b34-4e5f-7a6b-9c7d-8e9f0a1b2c3d
    Retry-After:
      description: Seconds. On every 429 and 503, on `403 key_suspended`, on `409 idempotency_in_progress` (2) and on a job's `202` (5, and while `GET /jobs/{id}` is pending or running).
      schema:
        type: integer
        minimum: 0
      example: 17
    Dona-Rate-Limited-Reason:
      description: Which limiter refused. On every 429/503 from the limiter and on `403 key_suspended` (`suspended`).
      schema:
        type: string
        enum:
        - key-rate
        - write-rate
        - seller-rate
        - concurrency
        - object-cooldown
        - app-rate
        - global
        - suspended
      example: key-rate
    X-Dona-Key-Expires:
      description: 'Present only in the last 14 days of the key''s life: its `expires_at`.'
      schema:
        type: string
        format: date-time
      example: '2026-10-05T00:00:00+05:00'
    Dona-API-Warn:
      description: Human-readable warning (a clamped `limit`, a deprecated operation, a slow `page` alias). Never a machine contract.
      schema:
        type: string
      example: limit clamped to 100
    Deprecation:
      description: RFC 9745. Present only on a deprecated operation (none in v1).
      schema:
        type: string
      example: '@1798761600'
    Sunset:
      description: RFC 8594. Present only on a deprecated operation, with the date after which it answers 410.
      schema:
        type: string
      example: Wed, 01 Sep 2027 00:00:00 GMT
    ETag:
      description: Hash over `max(updated_at)‖count` per (key, filter) — `If-None-Match` then answers 304 (cost 0.5).
      schema:
        type: string
      example: W/"a1b2c3d4"
    Cache-Control:
      description: Every key-authenticated response is `no-store, private`.
      schema:
        type: string
      example: no-store, private
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1–255 chars. Scope = this key × route. Terminal 2xx/4xx replayed byte-identical for 24 h; a 5xx is never stored.
        Missing ⇒ `400 invalid_body` with `details[{field:"Idempotency-Key",code:"required"}]`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: sync-2026-09-24T09:05
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Localises `message` in error bodies and single-language renderings. Default `uz`.
      schema:
        type: string
        enum:
        - uz
        - ru
        - en
        default: uz
    XDonaIntegration:
      name: X-Dona-Integration
      in: header
      required: false
      description: '`name/version` of the calling integration; stored (≤ 128 chars) and searchable in the request journal.'
      schema:
        type: string
        maxLength: 128
      example: billz-connector/2.4.1
    DonaDryRun:
      name: Dona-Dry-Run
      in: header
      required: false
      description: '`true` ⇒ validate + guard + compute the effect, then roll back. Zero side-effect rows (no events, no activity, no
        counters). Same as `?dry_run=true`. Only the literal `true` / `false`; any other value ⇒ `400 invalid_body` +
        `details[{field:"Dona-Dry-Run", code:"invalid"}]` (C51).'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    DryRunQuery:
      name: dry_run
      in: query
      required: false
      description: Alias of the `Dona-Dry-Run` header. Only the literal strings `true` / `false` — `1`, `0`, `TRUE`, `yes`, an empty
        value ⇒ `400 invalid_body` + `details[{field:"dry_run", code:"invalid"}]` (C51). A string enum, not a boolean, so no SDK
        generator serialises it as `1`/`0`.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    DonaSeller:
      name: Dona-Seller
      in: header
      required: false
      description: 'Vendor-app install keys only (`dona_it_live_…`, S6) — and then REQUIRED on every request, public routes
        included: the id of the shop the install key belongs to. Missing ⇒ `400 invalid_body` + `details[{field:"Dona-Seller",
        code:"required"}]`; sent more than once, or not ONE id in the canonical form the API prints (lower-case, 36 characters
        — no braces, no `urn:uuid:`, no padding) ⇒ `400 invalid_body` + `details[{field:"Dona-Seller", code:"invalid"}]`; naming
        any other shop — even one that installed the same app ⇒ `404 not_found` (never 403; nothing is read). Ignored on a seller
        key (`dona_sk_`).'
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An `ETag` from a previous identical request ⇒ `304` with rate headers (cost 0.5).
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 50, max 100 (clamped, with `Dona-API-Warn`). `limit > 50` costs `1 + ceil(limit/50)`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    UpdatedSince:
      name: updated_since
      in: query
      required: false
      description: ISO 8601 with offset, or epoch milliseconds. The visible high-water mark is capped at `now() − 10 s` so a slow transaction
        is never skipped.
      schema:
        type: string
      example: '2026-09-24T09:00:00+05:00'
    Page:
      name: page
      in: query
      required: false
      description: 0-based page alias (Uzum parity) — slower than `cursor`, ≤ 1 000 pages; mutually exclusive with `cursor`.
      schema:
        type: integer
        minimum: 0
        maximum: 999
    IdPath:
      name: id
      in: path
      required: true
      description: Resource id (UUIDv7). A foreign or missing id is always `404 not_found`.
      schema:
        type: string
        format: uuid
    WebhookIdHeader:
      name: webhook-id
      in: header
      required: true
      description: = the event id. Your idempotency key — dedupe for 24 h.
      schema:
        type: string
        format: uuid
    WebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix seconds. Reject if |now − ts| > 300 s. A redelivery carries a FRESH timestamp.
      schema:
        type: integer
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: 'Standard Webhooks: space-delimited `v1,<base64 HMAC-SHA256(base64decode(secret after whsec_), id + "." + ts + "."
        + rawBody)>`; two entries during a 24 h rotation.'
      schema:
        type: string
      example: v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4=
    WebhookRequestIdHeader:
      name: Dona-Request-Id
      in: header
      required: true
      description: Correlates with the delivery log.
      schema:
        type: string
  responses:
    BadRequest:
      description: '`invalid_body` — malformed JSON, a missing `Idempotency-Key`, validation (`details[]` carries field codes such as
        `ikpu_required`, `cursor_expired`), a `dry_run` / `Dona-Dry-Run` that is not the literal `true`/`false` (`details[{field,
        code:"invalid"}]`, C51), a vendor-app install key without `Dona-Seller` (`details[{field:"Dona-Seller", code:"required"}]`,
        S6) or with a repeated / non-canonical one (`code:"invalid"`), or an op-specific 400 (`invalid_decline_reason`).'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error: invalid_body
                message: IKPU kodi majburiy.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details:
                - field: ikpu
                  code: ikpu_required
                  message: IKPU kodi majburiy.
                doc_url: https://dona.uz/developers/errors#invalid_body
            cursor_expired:
              value:
                error: invalid_body
                message: Kursor 30 kunlik oynadan eskirgan.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details:
                - field: cursor
                  code: cursor_expired
                  message: Kursor eskirgan — toʻliq solishtiring.
                doc_url: https://dona.uz/developers/errors#invalid_body
                meta:
                  oldest_event_id: 01997b2f-0102-7345-9678-9abcdef01234
    Unauthorized:
      description: '`api_key_malformed` (checksum fails — refused before any DB read) · `api_key_expired` (+`rotate_url`, no grace)
        · `api_key_revoked` (also a vendor-app key whose install was uninstalled — S6) · `key_kind_not_accepted` (an agent key `ak`
        on this tree) · `use_authorization_header` (`X-Api-Key` or a query-string key) · a seller/app/staff JWT on this tree.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            revoked:
              value:
                error: api_key_revoked
                message: Bu kalit bekor qilingan.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#api_key_revoked
            expired:
              value:
                error: api_key_expired
                message: Kalit muddati tugagan.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#api_key_expired
                rotate_url: https://seller.dona.im/settings/api
    Forbidden:
      description: '`insufficient_scope` (+`required_scope`; also a scope in `disabled_scopes`) · `tier_required` (+`scope`; derived on every request; also a key minted for a third-party
        `orders:pii` recipient — `details[pii_recipient: pii_third_party_pending_counsel]`, D7, C59) · `key_suspended`
        (+`suspended_until`, `Retry-After`, `Dona-Rate-Limited-Reason: suspended`) · `api_blocked` · `ip_not_allowed` (judged on the
        trusted client IP only) · `seller_not_approved` (shop closed/blocked/suspended/restricted) · `not_a_seller` (never on this tree;
        the portal''s owner doors) · `app_frozen` (S6: every key of a frozen vendor app, from the next request).'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        Dona-Rate-Limited-Reason:
          $ref: '#/components/headers/Dona-Rate-Limited-Reason'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            scope:
              value:
                error: insufficient_scope
                message: Bu amal uchun ruxsat yetarli emas.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#insufficient_scope
                required_scope: orders:write
            suspended:
              value:
                error: key_suspended
                message: Kalit vaqtincha toʻxtatilgan.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#key_suspended
                suspended_until: '2026-09-24T14:20:12+05:00'
                retry_after_seconds: 900
                reason: error_storm
    NotFound:
      description: '`not_found` — every missing OR foreign id (never 403: no existence oracle).'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                error: not_found
                message: Topilmadi.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#not_found
    Conflict:
      description: '`idempotency_in_progress` (+`Retry-After: 2`) · `idempotency_mismatch` · `version_conflict` · `ai_review_open` (publish of a product whose Dona AI review case is open — the review decides its status) · order codes `order_not_acceptable`,
        `no_pickup_address`, `order_not_shippable`, `order_awaiting_courier`, `order_not_cancellable`, `order_has_active_return` ·
        document codes `no_tracking_number` (+`orders`), `no_items_selected`, `all_items_delayed` (S4, C53) · a replay of a rejected
        held write.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            mismatch:
              value:
                error: idempotency_mismatch
                message: Bu Idempotency-Key boshqa soʻrov bilan ishlatilgan.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#idempotency_mismatch
            order:
              value:
                error: order_not_shippable
                message: Buyurtmani joʻnatib boʻlmaydi.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#order_not_shippable
    PayloadTooLarge:
      description: '`payload_too_large` — body > 256 KiB (4 MiB on bulk stock/prices/batch), or > 1 000 lines.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            too_large:
              value:
                error: payload_too_large
                message: Soʻrov hajmi juda katta.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#payload_too_large
    Unprocessable:
      description: '`webhook_url_invalid` (+`details[].code` ∈ `timeout`, `status_<n>`, `tls`, `dns`, `private_address`, `scheme`) ·
        `warehouse_unsupported`.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            webhook:
              value:
                error: webhook_url_invalid
                message: Webhook manzili tekshiruvdan oʻtmadi.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details:
                - field: url
                  code: timeout
                  message: PING 1 soniyada javob bermadi.
                doc_url: https://dona.uz/developers/errors#webhook_url_invalid
    TooManyRequests:
      description: '`rate_limited` (with `Dona-Rate-Limited-Reason: app-rate`: a vendor app''s bucket, shared by all its installs — S6) · `write_rate_limited` · `concurrency_limited` · `seller_rate_limited` · `object_cooldown` · `api_busy`.
        Always a JSON body + `Retry-After` from the origin (an edge 429 from Cloudflare has NO body — treat it as `Retry-After: 60`).
        Costs 0 and never counts toward the breaker. `rate_limited` is also the pre-auth ADDRESS guard, answered before the key is
        read: an address over 1 200 requests a minute that were not admitted (no key, a public route, a malformed, unknown or refused
        key — admitted requests never count), or one tarpitted at 60/min for 15 min after ≥ 20 unknown keys in a minute. No key is
        ever suspended by traffic that did not prove it.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        Dona-Rate-Limited-Reason:
          $ref: '#/components/headers/Dona-Rate-Limited-Reason'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            key_rate:
              value:
                error: rate_limited
                message: Bu kalit uchun daqiqasiga 300 soʻrov; 17 soniyadan keyin qayta urining.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#rate_limited
                retry_after_seconds: 17
    InternalError:
      description: '`internal_error` — details are in the redacted error copy, never here. Costs 0.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              value:
                error: internal_error
                message: Nimadir notoʻgʻri ketdi.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#internal_error
    ServiceUnavailable:
      description: '`auth_unavailable` (key lookup failed — fail closed) · `limits_unavailable` (limiter blind on a write/MCP call,
        or a kill switch is off: `enabled`, `writes_enabled`, `webhooks_enabled`; `Retry-After: 30`) · `attention_busy` (an
        acknowledgement that resolves an item could not take the attention writer lock within 2 s — nothing was written; retry
        after `Retry-After: 2`) · `wallet_unavailable` (`/finance/*`: the wallet could not answer for the shop; `Retry-After: 30`; its
        body is never relayed or error-copied — S4, C57) · `role_unavailable` (+ `served_by: "marketplace"`: a SERVER_ROLE=seller-api
        server does not serve decline / cancel or `/finance/*`; answered before any read or write, nothing changed; no
        `Retry-After` — D3). Costs 0.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        Dona-Rate-Limited-Reason:
          $ref: '#/components/headers/Dona-Rate-Limited-Reason'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            limits:
              value:
                error: limits_unavailable
                message: Hozircha yozish imkoni yoʻq.
                request_id: req_01997b2e-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                details: []
                doc_url: https://dona.uz/developers/errors#limits_unavailable
                retry_after_seconds: 30
    EdgeTooManyRequests:
      description: 'Cloudflare edge, per-IP 60/min on public routes. **No JSON body** (the edge eats it) — treat as `Retry-After: 60`.'
    NotModified:
      description: '`If-None-Match` matched. Rate headers present; costs 0.5.'
      headers:
        Dona-Request-Id:
          $ref: '#/components/headers/Dona-Request-Id'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
  schemas:
    LocalizedText:
      type: object
      properties:
        uz:
          type: string
        ru:
          type: string
        en:
          type: string
      description: '`jsonb {uz,ru,en}`; readers fall back uz → ru → en.'
      additionalProperties: false
      minProperties: 1
    Scope:
      type: string
      enum:
      - catalog:read
      - catalog:stock
      - catalog:write
      - orders:read
      - orders:write
      - orders:cancel
      - orders:pii
      - returns:read
      - health:read
      - attention:read
      - events:read
      - webhooks:manage
      - finance:read
      - mcp
      description: The 14 issuable scopes (glossary). `returns:write` is reserved and unissued.
    Tier:
      type: string
      enum:
      - basic
      - advanced
      description: 'Key tier, derived per request (never cached): ADVANCED = kyc approved AND documents approved (a waiver never counts)
        AND shop approved AND no active punishment; `seller_api_access.tier_override` may lower or raise it but never lifts a sanction.'
    KeyKind:
      type: string
      enum:
      - sk
      - ak
      - it
      description: '`sk` seller integration · `ak` AI agent (MCP) · `it` vendor install (S6).'
    ErrorDetail:
      type: object
      properties:
        index:
          type: integer
          description: Line index in a bulk body.
        field:
          type: string
          description: Field or header name.
        code:
          type: string
          description: Stable field-level code, e.g. `required`, `ikpu_required`, `cursor_expired`.
        message:
          type: string
          description: Localised by `Accept-Language`.
      required:
      - code
      - message
    Error:
      type: object
      properties:
        error:
          type: string
          description: Stable code (glossary / docs/error-codes.md). Clients branch on this, never on `message`.
        message:
          type: string
          description: Localised by `Accept-Language` (uz default).
        request_id:
          type: string
          pattern: ^req_
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Always present; `[]` when there is nothing field-level.
        doc_url:
          type: string
          format: uri
          description: Anchor into the docs for this code.
        retry_after_seconds:
          type: integer
          description: Mirrors `Retry-After` on 429/503/`key_suspended`.
        required_scope:
          $ref: '#/components/schemas/Scope'
        rotate_url:
          type: string
          format: uri
          description: 'On `401 api_key_expired`: the portal page to mint a successor.'
        suspended_until:
          type: string
          format: date-time
          description: On `403 key_suspended`.
        reason:
          type: string
          description: 'On `403 key_suspended` / `403 api_blocked`: why (`error_storm`, `unauthorized_storm`, `ip_blocked`, `credential_stuffing`,
            `leak_reported`, `staff`).'
        meta:
          type: object
          properties:
            oldest_event_id:
              type: string
              format: uuid
          description: Code-specific facts, e.g. `oldest_event_id` with `cursor_expired`.
          additionalProperties: true
      required:
      - error
      - message
      - request_id
      - details
      - doc_url
      description: The estate `{"error":"<code>"}` envelope (`internal/platform/web/respond.go` `WriteErrorWith`) plus the Dona API
        fields. Provider/DB detail never leaves; it goes to the redacted error copy.
    PageMeta:
      type: object
      properties: {}
      description: Endpoint-specific facts; clients must tolerate unknown keys.
      additionalProperties: true
    HeldForReview:
      type: object
      properties:
        code:
          type: string
          const: held_for_review
        status:
          type: string
          const: held
        approval_id:
          type: string
          format: uuid
          description: '`seller_api_held_writes.id` — follow `write.approved|rejected|expired` events.'
        rule:
          type: string
          enum:
          - price_floor
          - drop_100x
          - stock_jump_10x
          - mass_zero_50pct
          - delist_30pct
          - confirmation_required
        kind:
          type: string
          enum:
          - price
          - stock
          - product
          - delist
        subject:
          type: object
          properties:
            type:
              type: string
              enum:
              - product
              - product_variant
              - batch
            id:
              type:
              - string
              - 'null'
              format: uuid
          required:
          - type
          - id
        approver:
          type: string
          enum:
          - owner
          - staff
          description: '`owner` when the value effect ≤ `owner_approval_max_uzs` (D18) and no repeat/suspension/health rule applies;
            else `staff` (`api.approve`).'
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 with offset (Tashkent `+05:00` on output).
        message:
          type: string
        request_id:
          type: string
          pattern: ^req_
      required:
      - code
      - status
      - approval_id
      - rule
      - kind
      - subject
      - approver
      - expires_at
      - message
      - request_id
      description: '`202` success envelope — `error` is ABSENT. Nothing was written. A replay of the same `Idempotency-Key` re-derives
        from the held row (approved ⇒ the applied outcome · rejected ⇒ 409 · pending ⇒ this 202 again) — never a second hold.'
    Limits:
      type: object
      properties:
        requests_per_min:
          type: integer
        burst:
          type: integer
        requests_per_day:
          type: integer
        writes_per_min:
          type: integer
        writes_per_day:
          type: integer
        in_flight:
          type: integer
        seller_requests_per_min:
          type: integer
        remaining:
          type: object
          properties:
            requests_per_min:
              type: integer
            requests_per_day:
              type: integer
            writes_per_min:
              type: integer
            writes_per_day:
              type: integer
          description: Snapshot at response time.
      required:
      - requests_per_min
      - burst
      - requests_per_day
      - writes_per_min
      - writes_per_day
      - in_flight
      - seller_requests_per_min
      - remaining
    Me:
      type: object
      properties:
        key:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            kind:
              $ref: '#/components/schemas/KeyKind'
            prefix:
              type: string
              description: First 16 characters; not a secret.
            scopes:
              type: array
              items:
                $ref: '#/components/schemas/Scope'
            expires_at:
              type: string
              format: date-time
              description: ISO 8601 with offset (Tashkent `+05:00` on output).
            ip_allow:
              type: array
              items:
                type: string
                description: CIDR
          required:
          - id
          - name
          - kind
          - prefix
          - scopes
          - expires_at
          - ip_allow
        shop:
          type: object
          properties:
            id:
              type: string
              format: uuid
